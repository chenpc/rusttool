# Detached from the repo-root cargo workspace, same reason as guest-init and
# probe-ok: a case crate is not a tool and must not be a workspace member.
[workspace]

[package]
name = "column-cases"
version = "0.1.0"
edition = "2021"
description = "Guest-side integration tests for /mnt/bin/column"
# One bin per testcase, declared explicitly so the guest test ids are stable.
autobins = false

# Cargo crate names may not contain '.', so the bin target of testcase
# <tool>.<case> is named <tool>_<case>; pack-initramfs.sh installs it on the
# 9p share as guest-root/tests/<tool>.<case>. Keep the two in sync.
[[bin]]
name = "column_basic"
path = "src/bin/column_basic.rs"

[[bin]]
name = "column_width"
path = "src/bin/column_width.rs"

[[bin]]
name = "column_fillrows"
path = "src/bin/column_fillrows.rs"

[[bin]]
name = "column_table"
path = "src/bin/column_table.rs"

[[bin]]
name = "column_separators"
path = "src/bin/column_separators.rs"

[[bin]]
name = "column_files"
path = "src/bin/column_files.rs"

[[bin]]
name = "column_version"
path = "src/bin/column_version.rs"

[dependencies]

[profile.release]
opt-level = "z"
strip = true
