# Detached from the repo-root cargo workspace, same reason as guest-init and
# probe-ok: a case crate is not a tool and must not be a workspace member.
[workspace]

[package]
name = "colcrt-cases"
version = "0.1.0"
edition = "2021"
description = "Guest-side integration tests for /mnt/bin/colcrt"
# One bin per testcase, declared explicitly so the guest test ids are stable.
autobins = false

# Cargo crate names may not contain '.', so the bin target of testcase
# <tool>.<case> is named <tool>_<case>; pack-initramfs.sh installs it on the
# 9p share as guest-root/tests/<tool>.<case>. Keep the two in sync.
[[bin]]
name = "colcrt_basic"
path = "src/bin/colcrt_basic.rs"

[[bin]]
name = "colcrt_underline"
path = "src/bin/colcrt_underline.rs"

[[bin]]
name = "colcrt_nounder"
path = "src/bin/colcrt_nounder.rs"

[[bin]]
name = "colcrt_halflines"
path = "src/bin/colcrt_halflines.rs"

[[bin]]
name = "colcrt_file"
path = "src/bin/colcrt_file.rs"

[[bin]]
name = "colcrt_version"
path = "src/bin/colcrt_version.rs"

[dependencies]

[profile.release]
opt-level = "z"
strip = true
