# Detached from the repo-root cargo workspace, same reason as guest-init and
# probe-ok: a case crate is not a tool and must not be a workspace member.
[workspace]

[package]
name = "bits-cases"
version = "0.1.0"
edition = "2021"
description = "Guest-side integration tests for /mnt/bin/bits"
# One bin per testcase, declared explicitly so the guest test ids are stable.
autobins = false

# Cargo crate names may not contain '.', so the bin target of testcase
# <tool>.<case> is named <tool>_<case>; pack-initramfs.sh installs it on the
# 9p share as guest-root/tests/<tool>.<case>. Keep the two in sync.
[[bin]]
name = "bits_list"
path = "src/bin/bits_list.rs"

[[bin]]
name = "bits_mask"
path = "src/bin/bits_mask.rs"

[[bin]]
name = "bits_binary"
path = "src/bin/bits_binary.rs"

[[bin]]
name = "bits_grouped"
path = "src/bin/bits_grouped.rs"

[[bin]]
name = "bits_stdin"
path = "src/bin/bits_stdin.rs"

[[bin]]
name = "bits_version"
path = "src/bin/bits_version.rs"

[dependencies]

[profile.release]
opt-level = "z"
strip = true
